name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: cmd
        run: windows\build.cmd ${{ matrix.arch }} ${{ needs.version.outputs.version }}

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: >
          windows/installer/package.ps1
          -Arch ${{ matrix.arch }}
          -Version ${{ needs.version.outputs.version }}
          -RepoUrl "${{ github.server_url }}/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: windows/build/dist/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned .ipa)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash ios/build-ipa.sh "${{ needs.version.outputs.version }}" "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/build/*.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "iPhone Webcam ${{ needs.version.outputs.version }}"
          --notes-file .github/release-notes.md
          --generate-notes
          --verify-tag
